<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testando aprendizado</title>
    <style>
        div.quadrado {
            border: 5px solid black;
            border-radius: 20px;
            width: 300px;
            height: 95vh;
            display: inline-block;
            margin: 0px 60px;
        }

        div#q1 {
            background-image: url(images/pattern004.png);
        }

        div#q2 {
            background-image: url(images/pattern003.png);
        }

        div#q3 {
            background-image: linear-gradient(to bottom, orange, red);
        }

    </style>
</head>
<body>
    <div class="quadrado" id="q1">

    </div>

    <div class="quadrado" id="q2">

    </div>

    <div class="quadrado" id="q3">

    </div>
</body>
</html>
