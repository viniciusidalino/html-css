<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos com HTML5</title>
</head>
<body>
    <h1>Inserindo vídeos hospedados localmente.</h1>
    <p>Este vídeo está hospedado no meu próprio servidor</p>
    <hr>
    <video width="560px" poster="imagens/thumbnail-video.jpg" preload="metadata" controls loop>
        <source src="midia/meu-video-1.ogv" type="">
        <source src="midia/meu-video-1.mp4" type="">
        <source src="midia/meu-video-1.webm" type="">
        <p>Seu navegador não tem compatibilidade com vídeos.</p>
    </video>

    <h1>Inserindo vídeos do YouTube</h1>
    <hr>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/7g0APZgE5XE?si=c6w5sEB8KYoxIkI-" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
