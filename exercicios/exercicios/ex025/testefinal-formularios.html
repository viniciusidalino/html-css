<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Aplicando conhecimentos principais sobre formulários</h1>
    <fieldset>
        <legend>Dados Pessoais</legend>
        <p>
            <label for="idnome">Nome:</label>
            <input type="text" name="nome" id="idnome" required>
        </p>

        <p>
            <label for="idemail">E-mail:</label>
            <input type="email" name="email" id="idemail" required placeholder="seuemail@email.com">
        </p>

        <p>
            <label for="itel">Telefone:</label>
            <input type="tel" name="tel" id="itel" required placeholder="(xx) xxxxx-xxxx">
        </p>

    </fieldset>
</body>
</html>
